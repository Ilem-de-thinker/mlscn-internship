<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLSCN Admin Login</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">MLSCN Administration</h1>
          <p class="text-slate-600 text-sm mt-1">Authorized Council Oversight & Platform Management.</p>
        </div>

        <form id="admin-login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Email</label>
            <input type="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" value="admin@mlscn.gov.ng" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Secure Admin Password</label>
            <input type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" value="password" />
          </div>
          <button type="submit" id="admin-login-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Admin Secure Sign In
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      function handleAdminLogin(e) {
        if (e) e.preventDefault();
        const userObj = { role: 'admin', name: 'MLSCN Super Administrator', email: 'admin@mlscn.gov.ng' };

        try {
          if (typeof setCurrentUser === 'function') {
            setCurrentUser(userObj);
          } else {
            localStorage.setItem('mlscn_user', JSON.stringify(userObj));
          }
        } catch (err) {
          console.warn('Local storage error:', err);
        }

        window.location.href = 'admin-dashboard.html';
      }

      const form = document.getElementById('admin-login-form');
      if (form) {
        form.addEventListener('submit', handleAdminLogin);
      }
      const btn = document.getElementById('admin-login-btn');
      if (btn) {
        btn.addEventListener('click', (e) => {
          if (form && form.checkValidity && !form.checkValidity()) {
            return;
          }
          handleAdminLogin(e);
        });
      }
    </script>
  </body>
</html>
