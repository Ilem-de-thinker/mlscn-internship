<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Notifications & Alerts</h1>
        <p class="text-slate-600 text-sm mt-1">Real-time updates regarding your internship applications and MLSCN announcements.</p>
      </div>

      <div class="space-y-4">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex items-start space-x-4">
          <div class="w-10 h-10 bg-teal-50 text-teal-700 rounded-xl flex items-center justify-center font-bold text-lg shrink-0">📩</div>
          <div>
            <h3 class="font-bold text-slate-900 text-base mb-1">Application Received by LUTH</h3>
            <p class="text-slate-600 text-sm mb-2">Your application for the 2026/2027 internship cohort has been received and is currently under review by the selection committee.</p>
            <span class="text-xs text-slate-400">October 8, 2026</span>
          </div>
        </div>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
  </body>
</html>
