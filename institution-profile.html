<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institution Profile - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div id="institution-profile-content" class="space-y-8">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>

    <script src="/js/platform.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const instId = urlParams.get('id') || 'inst-1';
        const institutions = JSON.parse(localStorage.getItem('mlscn_institutions')) || [];
        const opportunities = JSON.parse(localStorage.getItem('mlscn_opportunities')) || [];
        
        const inst = institutions.find(i => i.id === instId) || institutions[0];
        const instOpps = opportunities.filter(o => o.institutionId === inst.id);

        const container = document.getElementById('institution-profile-content');
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div class="flex items-center space-x-6">
              <img src="${inst.logo}" alt="${inst.name}" class="w-24 h-24 rounded-2xl object-cover border border-slate-200" />
              <div>
                <div class="flex items-center space-x-3 mb-1">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700">${inst.status}</span>
                  <span class="text-xs font-medium text-slate-500">Accreditation: ${inst.accreditationNumber}</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1">${inst.name}</h1>
                <p class="text-sm text-slate-600">${inst.city}, ${inst.state} State • <strong class="text-slate-900">${inst.type}</strong></p>
              </div>
            </div>
            <div class="bg-teal-50 border border-teal-100 p-4 rounded-xl text-center">
              <p class="text-xs text-teal-800 font-semibold uppercase tracking-wider">Approved Slots</p>
              <p class="text-3xl font-extrabold text-teal-700">${inst.slots}</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
              <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs">
                <h3 class="font-bold text-slate-900 text-lg mb-4">About the Institution</h3>
                <p class="text-slate-600 text-sm leading-relaxed mb-6">${inst.description}</p>

                <h3 class="font-bold text-slate-900 text-lg mb-4">Active Internship Openings</h3>
                ${instOpps.length === 0 ? `<p class="text-sm text-slate-500 italic">No active internship openings posted at this time.</p>` : `
                  <div class="space-y-4">
                    ${instOpps.map(opp => `
                      <div class="p-6 rounded-xl border border-slate-200 bg-slate-50 flex justify-between items-center">
                        <div>
                          <h4 class="font-bold text-base text-slate-900 mb-1"><a href="opportunity-details.html?id=${opp.id}" class="hover:text-teal-700">${opp.title}</a></h4>
                          <p class="text-xs text-slate-500">Deadline: ${opp.deadline} • Slots: ${opp.slots}</p>
                        </div>
                        <a href="opportunity-details.html?id=${opp.id}" class="bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-medium hover:bg-teal-800 transition">Apply Now</a>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>

            <div class="space-y-6">
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                <h3 class="font-bold text-slate-900 text-base pb-3 border-b border-slate-100">Contact Information</h3>
                <div class="text-sm space-y-3">
                  <div>
                    <span class="block text-xs text-slate-500">Official Email</span>
                    <strong class="text-slate-900">${inst.email}</strong>
                  </div>
                  <div>
                    <span class="block text-xs text-slate-500">Phone Number</span>
                    <strong class="text-slate-900">${inst.phone}</strong>
                  </div>
                  <div>
                    <span class="block text-xs text-slate-500">MLSCN Verification Status</span>
                    <strong class="text-emerald-700">Fully Accredited Training Center</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    </script>
  </body>
</html>
