<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internship Details - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-6">
        <a href="opportunities.html" class="inline-flex items-center text-sm font-semibold text-teal-700 hover:text-teal-800">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          Back to Opportunities
        </a>
      </div>

      <div id="opportunity-details-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>

    <script src="/js/platform.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const oppId = urlParams.get('id');
        const opps = JSON.parse(localStorage.getItem('mlscn_opportunities')) || [];
        const opp = opps.find(o => o.id === oppId) || opps[0];

        const container = document.getElementById('opportunity-details-container');
        if (!opp) {
          container.innerHTML = `<div class="col-span-3 bg-white p-12 rounded-2xl text-center">Opportunity not found.</div>`;
          return;
        }

        container.innerHTML = `
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center space-x-3 mb-4">
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-teal-50 text-teal-700">${opp.state}</span>
                <span class="text-xs font-medium text-slate-500">Posted on: ${opp.postedDate}</span>
                <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">${opp.status}</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">${opp.title}</h1>
              <p class="text-lg font-semibold text-teal-800 mb-6">${opp.institutionName}</p>

              <div class="border-t border-slate-100 pt-6">
                <h3 class="font-bold text-slate-900 text-base mb-3">About the Internship Program</h3>
                <p class="text-slate-600 text-sm leading-relaxed mb-6">${opp.description}</p>
              </div>

              <div class="border-t border-slate-100 pt-6">
                <h3 class="font-bold text-slate-900 text-base mb-3">Eligibility & Qualification Requirements</h3>
                <ul class="space-y-2.5">
                  ${opp.requirements.map(req => `
                    <li class="flex items-start text-sm text-slate-700">
                      <svg class="w-5 h-5 text-teal-600 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                      <span>${req}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>
          </div>

          <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
              <h3 class="font-bold text-slate-900 text-base pb-3 border-b border-slate-100">Internship Summary</h3>
              
              <div class="space-y-4 text-sm">
                <div class="flex justify-between">
                  <span class="text-slate-500">Available Slots</span>
                  <strong class="text-slate-900">${opp.slots} Positions</strong>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-500">Application Deadline</span>
                  <strong class="text-red-600">${opp.deadline}</strong>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-500">Program Start Date</span>
                  <strong class="text-slate-900">${opp.startDate}</strong>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-500">Duration</span>
                  <strong class="text-slate-900">${opp.duration}</strong>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-500">Stipend / Allowance</span>
                  <strong class="text-teal-700">${opp.stipend || 'Standard'}</strong>
                </div>
              </div>

              <div class="pt-4 border-t border-slate-100">
                <a href="apply.html?id=${opp.id}" class="block w-full bg-teal-700 hover:bg-teal-800 text-white text-center font-medium py-3 rounded-xl text-sm transition shadow-sm mb-3">
                  Apply for this Internship
                </a>
                <a href="institution-profile.html?id=${opp.institutionId}" class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-center font-medium py-3 rounded-xl text-sm transition">
                  View Institution Profile
                </a>
              </div>
            </div>
          </div>
        `;
      });
    </script>
  </body>
</html>
