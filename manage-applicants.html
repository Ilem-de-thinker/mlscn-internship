<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Applicants - MLSCN Admin</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">National Registered Applicants</h1>
        <p class="text-slate-600 text-sm mt-1">Audit and review registered B.MLS graduates nationwide.</p>
      </div>

      <div id="admin-applicants-list" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs divide-y divide-slate-100">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      function renderNationalApplicants() {
        const apps = window.getStoredArray ? window.getStoredArray('mlscn_applications') : (JSON.parse(localStorage.getItem('mlscn_applications')) || []);
        const container = document.getElementById('admin-applicants-list');

        if (!container) return;

        container.innerHTML = apps.map(a => `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between py-4 gap-3">
            <div>
              <strong class="text-slate-900 text-base">${a.applicantName}</strong>
              <p class="text-xs text-slate-500 mt-0.5">MLSCN: <strong>${a.mlscnNumber}</strong> • ${a.university} (${a.graduationYear}) • CGPA: ${a.cgpa}</p>
              <p class="text-xs text-teal-800 font-medium mt-1">Application: ${a.opportunityTitle} at ${a.institutionName}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${a.status === 'Accepted' ? 'bg-emerald-50 text-emerald-800' : (a.status === 'Shortlisted' ? 'bg-teal-50 text-teal-800' : 'bg-amber-50 text-amber-800')}">${a.status}</span>
              <a href="review-application.html?id=${a.id}" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-3.5 py-1.5 rounded-lg text-xs transition">Audit Profile</a>
            </div>
          </div>
        `).join('');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderNationalApplicants);
      } else {
        renderNationalApplicants();
      }
    </script>
  </body>
</html>
