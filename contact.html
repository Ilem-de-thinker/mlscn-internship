<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact & Support - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Contact & Support Help Desk</h1>
        <p class="text-slate-600 text-sm mt-1">Get assistance from the MLSCN national internship support team.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
          <h2 class="text-xl font-bold text-slate-900">Send us a Message</h2>
          <form id="contact-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
              <input type="text" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="Chukwudi Okonkwo" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
              <input type="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="chukwudi@example.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Subject / Inquiry Type</label>
              <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                <option>Technical Support</option>
                <option>Placement Inquiry</option>
                <option>Institution Accreditation</option>
                <option>General Question</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Message</label>
              <textarea rows="4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="Describe your issue or question..."></textarea>
            </div>
            <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
              Submit Support Ticket
            </button>
          </form>
        </div>

        <div class="space-y-6">
          <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
            <h2 class="text-xl font-bold text-slate-900">MLSCN Headquarters</h2>
            <div class="text-sm space-y-4 text-slate-600">
              <div class="flex items-start space-x-3">
                <span class="text-teal-700 font-bold">📍</span>
                <span>Plot 1166, Mohammed Buhari Way, Central Business District, Abuja, Nigeria.</span>
              </div>
              <div class="flex items-center space-x-3">
                <span class="text-teal-700 font-bold">📧</span>
                <span>support@mlscn.gov.ng</span>
              </div>
              <div class="flex items-center space-x-3">
                <span class="text-teal-700 font-bold">📞</span>
                <span>+234 9 290 8831</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
  </body>
</html>
