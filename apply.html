<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Internship Application - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div>
          <span class="text-xs font-semibold px-3 py-1 rounded-full bg-teal-50 text-teal-700">Official Application Form</span>
          <h1 id="apply-title" class="text-2xl font-bold text-slate-900 mt-2">Internship Application</h1>
          <p id="apply-inst" class="text-teal-800 text-sm font-semibold"></p>
        </div>

        <form id="apply-form" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
              <input type="text" id="apply-name" value="Chukwudi Okonkwo" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">MLSCN Provisional Registration Number</label>
              <input type="text" id="apply-license" value="MLSCN/PR/2026/9821" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">University Attended</label>
              <input type="text" id="apply-uni" value="University of Lagos (UNILAG)" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Graduation CGPA / Class</label>
              <input type="text" id="apply-cgpa" value="4.45 (First Class)" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Upload B.MLS Certificate or Statement of Result</label>
            <input type="file" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            <p class="text-xs text-slate-400 mt-1">Pre-verified: bmls_certificate.pdf (attached)</p>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Upload MLSCN Provisional Registration / Induction Certificate</label>
            <input type="file" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            <p class="text-xs text-slate-400 mt-1">Pre-verified: mlscn_provisional.pdf (attached)</p>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Upload NYSC Call-up Letter / Exemption Certificate</label>
            <input type="file" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            <p class="text-xs text-slate-400 mt-1">Pre-verified: nysc_letter.pdf (attached)</p>
          </div>

          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Submit Application Securely
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      function initApply() {
        const urlParams = new URLSearchParams(window.location.search);
        const oppId = urlParams.get('id') || 'opp-1';
        const opps = window.getStoredArray ? window.getStoredArray('mlscn_opportunities') : (JSON.parse(localStorage.getItem('mlscn_opportunities')) || []);
        const opp = opps.find(o => o.id === oppId) || opps[0];

        if (opp) {
          const tElem = document.getElementById('apply-title');
          const iElem = document.getElementById('apply-inst');
          if (tElem) tElem.innerText = opp.title;
          if (iElem) iElem.innerText = opp.institutionName;
        }

        const user = window.getCurrentUser ? window.getCurrentUser() : {};
        if (user.name && document.getElementById('apply-name')) {
          document.getElementById('apply-name').value = user.name;
        }
        if (user.license && document.getElementById('apply-license')) {
          document.getElementById('apply-license').value = user.license;
        }

        const form = document.getElementById('apply-form');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('apply-name').value || 'Chukwudi Okonkwo';
            const license = document.getElementById('apply-license').value || 'MLSCN/PR/2026/9821';
            const uni = document.getElementById('apply-uni').value || 'University of Lagos (UNILAG)';
            const cgpa = document.getElementById('apply-cgpa').value || '4.45 (First Class)';

            const newApp = {
              id: 'app-' + Date.now(),
              opportunityId: opp ? opp.id : 'opp-1',
              opportunityTitle: opp ? opp.title : 'Medical Laboratory Science Internship 2026/2027 Cohort',
              institutionName: opp ? opp.institutionName : 'Lagos University Teaching Hospital (LUTH)',
              applicantId: 'usr-applicant',
              applicantName: name,
              applicantEmail: 'intern.applicant@example.com',
              phone: '+234 803 123 4567',
              mlscnNumber: license,
              university: uni,
              graduationYear: '2026',
              cgpa: cgpa,
              status: 'Under Review',
              submittedDate: new Date().toISOString().split('T')[0],
              documents: ['bmls_certificate.pdf', 'mlscn_provisional.pdf', 'nysc_letter.pdf']
            };

            let apps = window.getStoredArray ? window.getStoredArray('mlscn_applications') : (JSON.parse(localStorage.getItem('mlscn_applications')) || []);
            apps.unshift(newApp);
            localStorage.setItem('mlscn_applications', JSON.stringify(apps));

            window.location.href = 'application-confirmation.html?id=' + newApp.id;
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApply);
      } else {
        initApply();
      }
    </script>
  </body>
</html>
