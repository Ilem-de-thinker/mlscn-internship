<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Applicants - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Applicant Submissions</h1>
        <p class="text-slate-600 text-sm mt-1">Review candidates who have applied to your institution's internship openings.</p>
      </div>

      <div id="institution-applicants-list" class="space-y-4">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const apps = JSON.parse(localStorage.getItem('mlscn_applications')) || [];
        const container = document.getElementById('institution-applicants-list');

        container.innerHTML = apps.map(app => `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
              <div class="flex items-center space-x-3 mb-2">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-800">${app.status}</span>
                <span class="text-xs text-slate-500">MLSCN: ${app.mlscnNumber}</span>
              </div>
              <h3 class="text-xl font-bold text-slate-900 mb-1"><a href="review-application.html?id=${app.id}" class="hover:text-blue-600">${app.applicantName}</a></h3>
              <p class="text-xs font-medium text-teal-800">${app.university} • CGPA: ${app.cgpa}</p>
            </div>
            <div class="flex gap-3">
              <a href="review-application.html?id=${app.id}" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs transition">
                Review Application
              </a>
            </div>
          </div>
        `).join('');
      });
    </script>
  </body>
</html>
