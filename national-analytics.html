<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Analytics - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">National Analytics & Placement Insights</h1>
        <p class="text-slate-600 text-sm mt-1">Aggregated internship placement data across all 36 states and the FCT.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
          <p class="text-xs font-semibold text-slate-500 uppercase">Total Placements (2026)</p>
          <p class="text-3xl font-extrabold text-slate-900 mt-2">1,540</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
          <p class="text-xs font-semibold text-slate-500 uppercase">Accredited Centers</p>
          <p class="text-3xl font-extrabold text-slate-900 mt-2">45</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
          <p class="text-xs font-semibold text-slate-500 uppercase">Placement Success Rate</p>
          <p class="text-3xl font-extrabold text-emerald-700 mt-2">94.2%</p>
        </div>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
  </body>
</html>
