<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Training Institution - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">Training Institution Registration</h1>
          <p class="text-slate-600 text-sm mt-1">Register your hospital or laboratory to post internship openings on the MLSCN national portal.</p>
        </div>

        <form id="institution-reg-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Institution Name</label>
            <input type="text" id="inst-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="e.g., National Hospital Abuja" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">State</label>
              <select id="inst-state" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                <option value="Lagos">Lagos</option>
                <option value="Oyo">Oyo</option>
                <option value="FCT - Abuja">FCT - Abuja</option>
                <option value="Enugu">Enugu</option>
                <option value="Kaduna">Kaduna</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Institution Type</label>
              <select id="inst-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                <option value="Federal Teaching Hospital">Federal Teaching Hospital</option>
                <option value="Federal Tertiary Hospital">Federal Tertiary Hospital</option>
                <option value="Specialist Laboratory">Specialist Laboratory</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">MLSCN Accreditation Number</label>
            <input type="text" id="inst-acc" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="MLSCN/ACC/202X/..." />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Official Email Address</label>
            <input type="email" id="inst-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="hr@hospital.gov.ng" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" id="inst-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="••••••••" />
          </div>
          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Submit Registration for Verification
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      document.getElementById('institution-reg-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Institution registration submitted successfully! Pending MLSCN administrative verification.');
        window.location.href = 'institution-login.html';
      });
    </script>
  </body>
</html>
