<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Internship Opportunities - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Internship Opportunities</h1>
        <p class="text-slate-600 text-sm mt-1">Discover and apply to accredited Medical Laboratory Science training centers across Nigeria.</p>
      </div>

      <!-- Filters Bar -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Search Keywords</label>
          <input type="text" id="filter-keyword" placeholder="Hospital name, discipline..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">State</label>
          <select id="filter-state" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
            <option value="">All States</option>
            <option value="Lagos">Lagos</option>
            <option value="Oyo">Oyo</option>
            <option value="FCT - Abuja">FCT - Abuja</option>
            <option value="Enugu">Enugu</option>
            <option value="Kaduna">Kaduna</option>
            <option value="Rivers">Rivers</option>
            <option value="Edo">Edo</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Institution Type</label>
          <select id="filter-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
            <option value="">All Types</option>
            <option value="Federal Teaching Hospital">Federal Teaching Hospital</option>
            <option value="Federal Tertiary Hospital">Federal Tertiary Hospital</option>
            <option value="State Teaching Hospital">State Teaching Hospital</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="apply-filters-btn" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2 px-4 rounded-xl text-sm transition">
            Apply Filters
          </button>
        </div>
      </div>

      <!-- Opportunities List -->
      <div id="opportunities-list" class="grid grid-cols-1 gap-6">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>

    <script src="js/platform.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const opps = JSON.parse(localStorage.getItem('mlscn_opportunities')) || [];
        const listContainer = document.getElementById('opportunities-list');
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q') || '';
        const stateParam = urlParams.get('state') || '';

        if (document.getElementById('filter-keyword')) document.getElementById('filter-keyword').value = qParam;
        if (document.getElementById('filter-state')) document.getElementById('filter-state').value = stateParam;

        function renderList(data) {
          if (data.length === 0) {
            listContainer.innerHTML = `<div class="bg-white p-12 rounded-2xl text-center text-slate-500 border border-slate-200">No internship opportunities match your filter criteria.</div>`;
            return;
          }

          listContainer.innerHTML = data.map(opp => `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
              <div class="flex-1">
                <div class="flex items-center space-x-3 mb-2">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-teal-50 text-teal-700">${opp.state}</span>
                  <span class="text-xs font-medium text-slate-500">Deadline: ${opp.deadline}</span>
                  <span class="text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">${opp.status}</span>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-1">
                  <a href="opportunity-details.html?id=${opp.id}" class="hover:text-teal-700">${opp.title}</a>
                </h3>
                <p class="text-sm font-semibold text-teal-800 mb-3">${opp.institutionName}</p>
                <p class="text-sm text-slate-600 line-clamp-2 mb-4">${opp.description}</p>
                <div class="flex flex-wrap gap-4 text-xs text-slate-500 font-medium">
                  <span>Available Slots: <strong class="text-slate-900">${opp.slots}</strong></span>
                  <span>Duration: <strong class="text-slate-900">${opp.duration}</strong></span>
                  <span>Stipend: <strong class="text-slate-900">${opp.stipend || 'Standard'}</strong></span>
                </div>
              </div>
              <div>
                <a href="opportunity-details.html?id=${opp.id}" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-6 py-3 rounded-xl text-sm transition shadow-sm whitespace-nowrap block text-center">
                  View & Apply
                </a>
              </div>
            </div>
          `).join('');
        }

        function filterAndRender() {
          const kw = document.getElementById('filter-keyword').value.toLowerCase();
          const st = document.getElementById('filter-state').value;
          const tp = document.getElementById('filter-type').value;

          const filtered = opps.filter(o => {
            const matchesKw = o.title.toLowerCase().includes(kw) || o.institutionName.toLowerCase().includes(kw) || o.description.toLowerCase().includes(kw);
            const matchesSt = !st || o.state === st;
            return matchesKw && matchesSt;
          });
          renderList(filtered);
        }

        document.getElementById('apply-filters-btn').addEventListener('click', filterAndRender);
        filterAndRender();
      });
    </script>
  </body>
</html>
