<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Reports - MLSCN Admin</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">National Placement Reports</h1>
        <p class="text-slate-600 text-sm mt-1">Exportable PDF/CSV reports for council review.</p>
      </div>

      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center">
        <div>
          <h3 class="font-bold text-lg text-slate-900">2026 Annual Internship Placement Summary</h3>
          <p class="text-xs text-slate-500">Comprehensive report across all geo-political zones.</p>
        </div>
        <button onclick="alert('Report exported successfully!')" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-medium hover:bg-slate-800">Export Report</button>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
  </body>
</html>
