<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Opportunity - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Edit Internship Opportunity</h1>
          <p class="text-slate-600 text-sm mt-1">Modify position requirements, slots, or deadlines.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Opportunity updated successfully!'); window.location.href='manage-opportunities.html';" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Opportunity Title</label>
            <input type="text" value="Medical Laboratory Science Internship 2026/2027 Cohort" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Available Slots</label>
              <input type="number" value="25" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Application Deadline</label>
              <input type="date" value="2026-11-30" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Save Changes
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
  </body>
</html>
