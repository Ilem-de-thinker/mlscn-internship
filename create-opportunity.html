<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Opportunity - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Post New Internship Opportunity</h1>
          <p class="text-slate-600 text-sm mt-1">Configure position details, slots, deadlines, and applicant eligibility.</p>
        </div>

        <form id="create-opp-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Opportunity Title</label>
            <input type="text" id="opp-title" required placeholder="e.g., Medical Laboratory Science Internship 2026/2027 Cohort" value="B.MLS Rotational Internship - 2026/2027 Batch" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Available Slots</label>
              <input type="number" id="opp-slots" required value="25" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Application Deadline</label>
              <input type="date" id="opp-deadline" required value="2026-12-31" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Monthly Stipend / Allowance</label>
            <input type="text" id="opp-stipend" required value="₦85,000 / month" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Description & Rotation Details</label>
            <textarea id="opp-desc" rows="4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="Provide overview of rotations...">Comprehensive 12-month rotating internship covering Chemical Pathology, Hematology, Medical Microbiology, and Histopathology diagnostics.</textarea>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Publish Internship Opening
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      const form = document.getElementById('create-opp-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const user = window.getCurrentUser ? window.getCurrentUser() : {};
          const instName = user.name || 'Lagos University Teaching Hospital (LUTH)';
          const newOpp = {
            id: 'opp-' + Date.now(),
            institutionId: 'inst-1',
            institutionName: instName,
            title: document.getElementById('opp-title').value,
            state: 'Lagos',
            type: 'Full-time / Rotational',
            slots: parseInt(document.getElementById('opp-slots').value) || 20,
            deadline: document.getElementById('opp-deadline').value,
            startDate: '2027-01-15',
            duration: '12 Months',
            stipend: document.getElementById('opp-stipend').value,
            description: document.getElementById('opp-desc').value,
            requirements: [
              'Bachelor of Medical Laboratory Science (B.MLS)',
              'MLSCN Provisional Registration Certificate',
              'Curriculum Vitae'
            ],
            status: 'Active',
            postedDate: new Date().toISOString().split('T')[0]
          };

          let opps = window.getStoredArray ? window.getStoredArray('mlscn_opportunities') : (JSON.parse(localStorage.getItem('mlscn_opportunities')) || []);
          opps.unshift(newOpp);
          localStorage.setItem('mlscn_opportunities', JSON.stringify(opps));

          alert('Internship opening posted successfully!');
          window.location.href = 'manage-opportunities.html';
        });
      }
    </script>
  </body>
</html>
