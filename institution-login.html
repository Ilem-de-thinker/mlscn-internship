<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institution Portal Login - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">Training Institution Portal</h1>
          <p class="text-slate-600 text-sm mt-1">Sign in using your MLSCN Accreditation / License Number.</p>
        </div>

        <form id="inst-login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">MLSCN Accreditation / License Number</label>
            <input type="text" id="inst-license" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="e.g., MLSCN/ACC/2021/045" value="MLSCN/ACC/2021/045" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" value="password" />
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Institution Sign In
          </button>
        </form>

        <p class="text-center text-xs text-slate-500">
          Want to register your center? <a href="institution-register.html" class="text-blue-600 font-semibold hover:underline">Register institution</a>
        </p>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
    <script>
      document.getElementById('inst-login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const license = document.getElementById('inst-license').value;
        setCurrentUser({ role: 'institution', name: 'Lagos University Teaching Hospital (LUTH)', license });
        window.location.href = 'institution-dashboard.html';
      });
    </script>
  </body>
</html>
