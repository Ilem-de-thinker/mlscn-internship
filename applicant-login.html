<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicant Login - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">Applicant Portal Login</h1>
          <p class="text-slate-600 text-sm mt-1">Sign in using your MLSCN License / Provisional Registration Number.</p>
        </div>

        <form id="applicant-login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">MLSCN License / Provisional Number</label>
            <input type="text" id="login-license" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="e.g., MLSCN/PR/2026/9821" value="MLSCN/PR/2026/9821" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-semibold text-slate-700">Password</label>
              <a href="forgot-password.html" class="text-xs text-teal-700 hover:underline">Forgot password?</a>
            </div>
            <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" value="password" />
          </div>
          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Sign In to Dashboard
          </button>
        </form>

        <p class="text-center text-xs text-slate-500">
          Don't have an account? <a href="applicant-register.html" class="text-teal-700 font-semibold hover:underline">Register here</a>
        </p>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
    <script>
      document.getElementById('applicant-login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const license = document.getElementById('login-license').value;
        setCurrentUser({ role: 'applicant', name: 'Chukwudi Okonkwo', license });
        window.location.href = 'applicant-dashboard.html';
      });
    </script>
  </body>
</html>
