<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Institutions - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Manage Accredited Institutions</h1>
        <p class="text-slate-600 text-sm mt-1">Review and verify training hospitals and medical laboratories nationwide.</p>
      </div>

      <div id="admin-institutions-list" class="space-y-4">
        <!-- Rendered via JS -->
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const insts = JSON.parse(localStorage.getItem('mlscn_institutions')) || [];
        const container = document.getElementById('admin-institutions-list');

        container.innerHTML = insts.map(i => `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
              <div class="flex items-center space-x-3 mb-2">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700">${i.status}</span>
                <span class="text-xs text-slate-500">Code: ${i.accreditationNumber}</span>
                <span class="text-xs font-semibold bg-teal-50 text-teal-700 px-2.5 py-1 rounded-full">${i.state}</span>
              </div>
              <h3 class="text-xl font-bold text-slate-900 mb-1"><a href="institution-profile.html?id=${i.id}" class="hover:text-teal-700">${i.name}</a></h3>
              <p class="text-xs text-slate-500">Type: ${i.type} • Approved Quota: <strong>${i.slots} slots</strong></p>
            </div>
            <div class="flex gap-3">
              <button onclick="alert('Institution verification status updated!');" class="bg-slate-900 text-white font-medium px-4 py-2 rounded-xl text-xs transition">Verify / Update</button>
            </div>
          </div>
        `).join('');
      });
    </script>
  </body>
</html>
