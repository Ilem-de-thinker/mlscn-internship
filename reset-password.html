<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">Set New Password</h1>
          <p class="text-slate-600 text-sm mt-1">Enter your new secure password.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Password updated successfully!'); window.location.href='applicant-login.html';" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
            <input type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="••••••••" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
            <input type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="••••••••" />
          </div>
          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Update Password
          </button>
        </form>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
  </body>
</html>
