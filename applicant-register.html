<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicant Registration - MLSCN</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="text-center">
          <h1 class="text-2xl font-bold text-slate-900">Create Applicant Account</h1>
          <p class="text-slate-600 text-sm mt-1">Register to apply for Medical Laboratory Science internships nationwide.</p>
        </div>

        <form id="applicant-reg-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name (as on B.MLS Certificate)</label>
            <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="Chukwudi Okonkwo" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
            <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="chukwudi@example.com" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">MLSCN Provisional Registration Number</label>
            <input type="text" id="reg-mlscn" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="MLSCN/PR/2026/..." />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" id="reg-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" placeholder="••••••••" />
          </div>
          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl text-sm transition shadow-sm">
            Complete Registration
          </button>
        </form>

        <p class="text-center text-xs text-slate-500">
          Already have an account? <a href="applicant-login.html" class="text-teal-700 font-semibold hover:underline">Login here</a>
        </p>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="/js/platform.js"></script>
    <script>
      document.getElementById('applicant-reg-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        setCurrentUser({ role: 'applicant', name, email });
        window.location.href = 'applicant-dashboard.html';
      });
    </script>
  </body>
</html>
