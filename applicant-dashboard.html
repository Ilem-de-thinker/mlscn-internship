<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicant Dashboard - MLSCN</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div class="dynamic-navbar"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full">Applicant Portal</span>
          <h1 class="text-3xl font-extrabold text-slate-900 mt-2">Welcome, Chukwudi Okonkwo</h1>
          <p class="text-slate-600 text-sm">MLSCN Registration No: <strong class="text-slate-900">MLSCN/PR/2026/9821</strong></p>
        </div>
        <div class="flex gap-3">
          <a href="opportunities.html" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm">
            Browse Opportunities
          </a>
          <a href="applicant-profile.html" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-medium px-5 py-2.5 rounded-xl text-sm transition">
            My Profile
          </a>
        </div>
      </div>

      <!-- Quick Metrics -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex items-center space-x-4">
          <div class="w-14 h-14 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center font-bold text-xl">📄</div>
          <div>
            <p class="text-2xl font-bold text-slate-900">1</p>
            <p class="text-xs text-slate-500 font-medium">Active Applications</p>
          </div>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex items-center space-x-4">
          <div class="w-14 h-14 bg-amber-50 text-amber-700 rounded-xl flex items-center justify-center font-bold text-xl">⏳</div>
          <div>
            <p class="text-2xl font-bold text-slate-900">Under Review</p>
            <p class="text-xs text-slate-500 font-medium">Latest Application Status</p>
          </div>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex items-center space-x-4">
          <div class="w-14 h-14 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center font-bold text-xl">⭐</div>
          <div>
            <p class="text-2xl font-bold text-slate-900">0</p>
            <p class="text-xs text-slate-500 font-medium">Saved Opportunities</p>
          </div>
        </div>
      </div>

      <!-- Recent Applications -->
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-slate-900">My Internship Applications</h2>
          <a href="my-applications.html" class="text-sm font-semibold text-teal-700 hover:underline">View All</a>
        </div>

        <div id="dashboard-applications-list" class="space-y-4">
          <!-- Rendered via JS -->
        </div>
      </div>
    </main>

    <div class="dynamic-footer"></div>
    <script src="js/platform.js"></script>
    <script>
      function renderDashboard() {
        const apps = window.getStoredArray ? window.getStoredArray('mlscn_applications') : (JSON.parse(localStorage.getItem('mlscn_applications')) || []);
        const container = document.getElementById('dashboard-applications-list');
        if (!container) return;

        const user = window.getCurrentUser ? window.getCurrentUser() : {};
        const welcomeHeading = document.querySelector('h1.text-3xl');
        if (welcomeHeading && user.name) {
          welcomeHeading.textContent = 'Welcome, ' + user.name;
        }

        if (apps.length === 0) {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-500 bg-slate-50 rounded-xl border border-slate-200">
              <p class="text-sm font-medium">No applications submitted yet.</p>
              <a href="opportunities.html" class="inline-block mt-3 bg-teal-700 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-teal-800 transition">Explore Open Opportunities &rarr;</a>
            </div>
          `;
          return;
        }

        container.innerHTML = apps.map(app => `
          <div class="p-6 rounded-xl border border-slate-200 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-800">${app.status}</span>
              <h3 class="font-bold text-base text-slate-900 mt-2"><a href="application-details.html?id=${app.id}" class="hover:text-teal-700">${app.opportunityTitle}</a></h3>
              <p class="text-xs font-medium text-teal-800">${app.institutionName}</p>
              <p class="text-xs text-slate-500 mt-1">Submitted on: ${app.submittedDate}</p>
            </div>
            <a href="application-details.html?id=${app.id}" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-4 py-2 rounded-xl text-xs transition">
              View Application
            </a>
          </div>
        `).join('');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderDashboard);
      } else {
        renderDashboard();
      }
    </script>
  </body>
</html>
